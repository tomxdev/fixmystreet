<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 64" width="252" height="64" role="img" aria-label="FixMyStreet Catanduva">
  <!--
    Marca do piloto municipal de Catanduva — UI Evolution V2.

    O texto acessivel vive no proprio <a id="site-logo">, escondido por
    text-indent, entao este arquivo e decorativo do ponto de vista do leitor de
    tela; o aria-label serve para quando o SVG for aberto sozinho.

    Sem webfont: um SVG carregado como background-image nao acessa as fontes da
    pagina, entao a pilha e generica de proposito e o desenho nao depende de
    metrica exata. Cores de docs/ui/DESIGN_SYSTEM.md — #0E1C2B sobre o cabecalho
    branco da 16.1, #00845F da 4.53.
  -->
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00845F"/>
      <stop offset="1" stop-color="#0A3F44"/>
    </linearGradient>
  </defs>

  <g>
    <path d="M20 2c-9.4 0-17 7.6-17 17 0 12.2 17 29 17 29s17-16.8 17-29c0-9.4-7.6-17-17-17z" fill="url(#pin)"/>
    <circle cx="20" cy="19" r="6.4" fill="#FFFFFF"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="48" y="30" font-size="27" font-weight="700" letter-spacing="-0.8">
      <tspan fill="#0E1C2B">FixMy</tspan><tspan fill="#00845F">Street</tspan>
    </text>
    <text x="50" y="50" font-size="11" font-weight="600" fill="#33475B" letter-spacing="5.6">CATANDUVA</text>
  </g>
</svg>
