<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 96" width="480" height="96" aria-hidden="true" focusable="false">
  <!--
    Silhueta em traco para o fundo da faixa de chamada. Desenhada para repetir na
    horizontal: o que sai pela borda direita continua na esquerda, entao o
    primeiro e o ultimo elemento sao meias figuras.

    Decorativa. Vai como background-image de .band-cta__skyline, com opacidade
    reduzida, e nunca carrega informacao.
  -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" opacity="0.55">
    <!-- linha do chao -->
    <path d="M0 95h480"/>

    <!-- arvore (meia, na borda esquerda) -->
    <path d="M-6 95V78"/>
    <path d="M-22 78a16 13 0 0 1 32 0"/>

    <!-- casario baixo -->
    <path d="M26 95V66h34v29"/>
    <path d="M26 66l17-11 17 11"/>
    <path d="M35 95V80h6v15M50 95V80h6v15"/>

    <!-- predio -->
    <path d="M74 95V52h26v43"/>
    <path d="M80 60h6v7h-6zM90 60h6v7h-6zM80 74h6v7h-6zM90 74h6v7h-6z"/>

    <!-- arvore -->
    <path d="M116 95V80"/>
    <path d="M100 80a16 13 0 0 1 32 0"/>

    <!-- galpao longo -->
    <path d="M146 95V72h58v23"/>
    <path d="M154 95V82h9v13M172 95V82h9v13M190 95V82h9v13"/>

    <!-- torre da igreja -->
    <path d="M232 95V40h20v55"/>
    <path d="M232 40l10-18 10 18"/>
    <path d="M242 22v-8"/>
    <path d="M238 52h8v12h-8z"/>
    <path d="M226 95V64h6v31M252 95V64h6v31"/>

    <!-- casario -->
    <path d="M276 95V70h30v25"/>
    <path d="M276 70l15-10 15 10"/>
    <path d="M286 95V82h10v13"/>

    <!-- arvores -->
    <path d="M328 95V82"/>
    <path d="M314 82a14 11 0 0 1 28 0"/>
    <path d="M354 95V78"/>
    <path d="M338 78a16 13 0 0 1 32 0"/>

    <!-- predio alto -->
    <path d="M386 95V46h24v49"/>
    <path d="M392 54h5v6h-5zM401 54h5v6h-5zM392 67h5v6h-5zM401 67h5v6h-5zM392 80h5v6h-5zM401 80h5v6h-5z"/>

    <!-- casario baixo -->
    <path d="M428 95V74h28v21"/>
    <path d="M428 74l14-9 14 9"/>

    <!-- arvore (meia, na borda direita — continua a da esquerda) -->
    <path d="M474 95V78"/>
    <path d="M458 78a16 13 0 0 1 32 0"/>
  </g>
</svg>
